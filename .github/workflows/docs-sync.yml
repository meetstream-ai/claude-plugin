name: docs-sync

# Nightly: re-read the public docs (openapi.yaml, llms.txt and every page that data/*.json cites).
# When anything changed, regenerate the references and store builds and open a pull request,
# so the skills never fall behind docs.meetstream.ai (Sid's rule, 24 Nov 2026).

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write   # push the docs-sync/auto branch
  issues: write     # open or update the review issue (the org does not let Actions open pull requests)

concurrency:
  group: docs-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Cited docs pages that changed since the last sync
        run: python3 scripts/sync_sources.py --check-pages | tee pages.txt || true
      - name: Refresh sources and regenerate
        run: |
          python3 -m pip install --quiet "pyyaml==6.0.2"
          python3 scripts/sync_sources.py
          python3 scripts/gen_references.py
          python3 scripts/check_coverage.py | tee coverage.txt || true
          python3 scripts/build_stores.py
      - name: Open or update the review issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet && ! grep -q "^changed:" pages.txt; then
            echo "docs unchanged"; exit 0
          fi
          git config user.name "meetstream-docs-sync"
          git config user.email "docs-sync@users.noreply.github.com"
          git checkout -B docs-sync/auto
          git add -A sources skills plugins docs gemini-extension.json .cursor-plugin
          git commit -m "Docs sync: regenerate references from docs.meetstream.ai" || true
          git push --force origin docs-sync/auto
          {
            echo "The nightly docs sync found changes on docs.meetstream.ai."
            echo
            echo "Changed docs pages that data/*.json cites (re-check those facts by hand):"
            echo '```'
            grep "^changed:" pages.txt || echo "none"
            echo '```'
            echo "Coverage check:"
            echo '```'
            tail -5 coverage.txt
            echo '```'
            echo "Review the changes: https://github.com/${GITHUB_REPOSITORY}/compare/main...docs-sync/auto"
            echo "Open a pull request from docs-sync/auto, update data/*.json where a cited page changed, then merge."
          } > body.md
          num=$(gh issue list --state open --label docs-sync --json number -q '.[0].number')
          if [ -n "$num" ]; then
            gh issue edit "$num" --body-file body.md
          else
            gh label create docs-sync --color E8620C --description "Nightly docs.meetstream.ai sync" 2>/dev/null || true
            gh issue create --title "Docs sync: docs.meetstream.ai changed" --label docs-sync --body-file body.md
          fi
