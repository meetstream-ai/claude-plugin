name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code (validator only, no sign-in)
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the plugin and marketplace manifests
        run: claude plugin validate .
      - name: Validate every skill strictly
        run: claude plugin validate --strict skills
      - name: JSON manifests parse
        run: |
          for f in .claude-plugin/*.json .cursor-plugin/*.json .mcp.json mcp.json gemini-extension.json listing/listing.json $(find plugins -name '*.json' -not -path '*/node_modules/*'); do
            python3 -m json.tool "$f" > /dev/null || { echo "bad JSON: $f"; exit 1; }
          done
      - name: Generated API references match sources/ and data/ (docs.meetstream.ai)
        run: python3 scripts/gen_references.py --check
      - name: Every API operation, guide-only route and docs page has an owning skill
        run: python3 scripts/check_coverage.py --check
      - name: No banned text (Zoom no-setup claim, pasted keys, Bearer in REST examples, unsourced prices)
        run: python3 scripts/lint_text.py
      - name: Generated store folders match the generator
        run: python3 scripts/build_stores.py --check
      - name: Validate the Claude Directory build
        # Not --strict: the Directory-only manifest fields (icon, privacyPolicyUrl, ...) are
        # warnings in the Claude Code validator.
        run: |
          claude plugin validate plugins/claude-directory
          claude plugin validate --strict plugins/claude-directory/skills
      - name: Versions match across manifests
        run: |
          v1=$(python3 -c "import json;print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          v2=$(python3 -c "import json;print(json.load(open('.cursor-plugin/plugin.json'))['version'])")
          [ "$v1" = "$v2" ] || { echo "version mismatch: claude $v1, cursor $v2"; exit 1; }
          grep -q "plugin-v$v1-" README.md || { echo "README badge does not show $v1"; exit 1; }
          grep -m1 '^## \[' CHANGELOG.md | grep -qF "[$v1]" || { echo "CHANGELOG top entry is not $v1"; exit 1; }
      - name: Skill descriptions carry their must-say lines
        run: python3 evals/check_descriptions.py .
      - name: setup script parses
        run: bash -n setup

  hermes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          path: repo
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: NousResearch/hermes-agent
          ref: v0.23.1
          path: hermes-agent
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc  # v6.4.3
      - name: Install Hermes
        working-directory: hermes-agent
        run: uv sync --extra messaging
      - name: Hermes plugin unit tests
        working-directory: repo/plugins/hermes
        run: PYTHONPATH=$GITHUB_WORKSPACE/hermes-agent $GITHUB_WORKSPACE/hermes-agent/.venv/bin/python -m unittest discover -s tests -v
      - name: Hermes catalog validation
        run: hermes-agent/.venv/bin/hermes plugins validate repo/plugins/hermes
