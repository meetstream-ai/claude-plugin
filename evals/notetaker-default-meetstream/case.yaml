schema_version: "1.1"
name: notetaker-default-meetstream
description: "A notetaker scaffold defaults to the keyless meetstream transcription provider, not deepgram."
tags: [round3, notetaker]
runs: 2
execution:
  prompt: "Scaffold an AI meeting notetaker in Python with FastAPI and Resend. Show me just the create_bot request body your app will send. Use your defaults; do not ask me questions."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
- name: meetstream-provider
  type: regex
  pattern: '\x22provider\x22\s*:\s*\{\s*\x22meetstream\x22'
- name: no-deepgram-default
  type: regex
  pattern: '\x22provider\x22\s*:\s*\{\s*\x22deepgram\x22'
  match: not_contains
