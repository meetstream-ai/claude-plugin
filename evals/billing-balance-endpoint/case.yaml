schema_version: "1.1"
name: billing-balance-endpoint
description: "Prepaid balance from code: GET /api/v1/billing/balance with the API key (read only); where it is not on yet, the billing page."
tags: [round5, billing]
runs: 1
execution:
  prompt: "How can my backend read my MeetStream prepaid balance with my API key? Give me the curl."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
- name: balance-route
  type: regex
  pattern: '/api/v1/billing/balance'
- name: billing-page
  type: regex
  pattern: 'app\.meetstream\.ai/billing'
