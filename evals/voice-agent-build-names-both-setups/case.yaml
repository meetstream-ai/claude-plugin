schema_version: "1.1"
name: voice-agent-build-names-both-setups
description: "A build request for a voice agent that does not say which stack: the bridge server (own stack) first, then the hosted Agents API with MeetStream's inbuilt keys and the user's own provider keys (MS-2305 three flows)."
tags: [round3, voice-agent]
runs: 2
execution:
  prompt: "Build me an AI voice agent that joins my Google Meet calls and answers questions about our product docs."
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
- name: bridge-offered
  type: regex
  pattern: 'bridge server|own stack'
  flags: i
- name: hosted-offered
  type: regex
  pattern: 'Agents API|MIA|host'
  flags: i
- name: no-bot-without-link
  type: tool_used
  tool: mcp__plugin_meetstream_meetstream__create_bot
  min: 0
  max: 0
