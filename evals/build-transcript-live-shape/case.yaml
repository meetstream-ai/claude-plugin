schema_version: "1.1"
name: build-transcript-live-shape
description: "Build feedback (4 of 4 harnesses): get_transcript segments are participant-keyed by default ({participant:{name}, words:[{text}]}), not only {speaker, transcript}. A parser must read participant.name and join words[].text (and fall back to speaker/transcript)."
tags: [builds, shapes]
runs: 1
execution:
  prompt: "Write a short Python function that takes the JSON from MeetStream's REST get_transcript (GET /api/v1/transcript/{transcript_id}/get_transcript) and returns 'Name: text' lines. Use the MeetStream skill for the field names; do not call any MeetStream tools and do not ask me questions."
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
- name: participant-name
  type: regex
  pattern: 'participant'
- name: words-text
  type: regex
  pattern: '[\x22\x27]words[\x22\x27]'
- name: no-bot-sent
  type: tool_used
  tool: mcp__plugin_meetstream_meetstream__create_bot
  min: 0
  max: 0
