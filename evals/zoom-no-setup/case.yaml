schema_version: "1.1"
name: zoom-no-setup
description: "Zoom needs no setup: no Zoom Marketplace app or SDK keys first."
tags: [zoom]
runs: 2
execution:
  prompt: "What do I need to set up before a MeetStream bot can join my Zoom meetings? Just tell me, don't send a bot yet."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
- name: no-bot-sent
  type: tool_used
  tool: mcp__plugin_meetstream_meetstream__create_bot
  min: 0
  max: 0
