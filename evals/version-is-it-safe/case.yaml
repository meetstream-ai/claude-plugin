schema_version: "1.1"
name: version-is-it-safe
description: "Is the plugin safe to use: no claim that one version is stable and another may break."
tags: [version-claims]
runs: 3
execution:
  prompt: "Is the MeetStream plugin safe to use in production right now, or should I wait? A teammate said the newer version might break things."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
