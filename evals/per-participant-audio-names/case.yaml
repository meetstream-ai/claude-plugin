schema_version: "1.1"
name: per-participant-audio-names
description: "Per-participant audio items carry the speaker in participant.name and the file in download_url (flat array)."
tags: [round4, media]
runs: 2
execution:
  prompt: "Write a Python function that downloads every per-participant audio file of bot b7c1e2d4-0a11-4c55-9e10-5d2f8a3b9c01 through the MeetStream REST API and names each file after the participant who spoke. Use the MeetStream skill for the response fields; do not call any MeetStream API tools and do not ask me questions."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
- name: participant-name
  type: regex
  pattern: 'participant[\x22\x27]\]\s*\[[\x22\x27]name|participant[\x22\x27]\s*(,\s*\{\})?\)(\s*or\s*\{\}\))?\s*\.get\(\s*[\x22\x27]name|participant\.get\(\s*[\x22\x27]name|participant\.name'
- name: download-url
  type: regex
  pattern: 'download_url'
- name: no-stale-participant-name
  type: regex
  pattern: 'participant_name'
  match: not_contains
