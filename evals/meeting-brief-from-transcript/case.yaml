schema_version: "1.1"
name: meeting-brief-from-transcript
description: "Brief from the last meeting: from get_transcript, real decisions and action items, no claimed built-in summary."
tags: [meeting-brief]
runs: 2
execution:
  prompt: "Give me a short brief of my last meeting: decisions, action items with owners, and open questions."
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
- name: reads-transcript
  type: tool_used
  tool: mcp__plugin_meetstream_meetstream__get_transcript
  min: 1
- name: mentions-launch-date
  type: regex
  pattern: 'January\s+20|Jan(uary)?\.?\s*20|20\s+Jan'
  flags: i
