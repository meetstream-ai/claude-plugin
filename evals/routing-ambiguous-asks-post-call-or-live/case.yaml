schema_version: "1.1"
name: routing-ambiguous-asks-post-call-or-live
description: "An unclear request. The first question is after the meeting or live; voice agents are not volunteered."
tags: [routing]
runs: 2
execution:
  prompt: "Help me use MeetStream."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
- name: no-voice-agent-mention
  type: regex
  pattern: '\bvoice[- ]agents?\b|\bMIA\b|\btalking bot\b|\bagent_config_id\b|\bbot that (talks|speaks|answers)\b'
  flags: i
  match: not_contains
