schema_version: "1.1"
name: app-response-shapes
description: "Code that reads MeetStream responses uses the real fields without reading references/: bot_id, transcript segments (participant-keyed: participant.name + words[].text, live shape), chatMessages, participants displayName, calendar meeting_url."
tags: [round3, shapes]
runs: 2
execution:
  prompt: "Write one short Python script (requests) against the MeetStream REST API that: creates a bot for a meeting link and stores its id; after the meeting prints each transcript segment as 'speaker: text'; prints every chat message with its sender; prints each participant's name; and lists my upcoming calendar events with each event's meeting link. Use the MeetStream skill for the field names, but do not call any MeetStream API tools, and do not ask me questions: just write the code in your reply."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
- name: bot-id-field
  type: regex
  pattern: '[\x22\x27]bot_id[\x22\x27]'
- name: transcript-participant-words
  type: regex
  pattern: '[\x22\x27]participant[\x22\x27][\s\S]{0,400}[\x22\x27]words[\x22\x27]|[\x22\x27]words[\x22\x27][\s\S]{0,400}[\x22\x27]participant[\x22\x27]'
- name: chat-messages-key
  type: regex
  pattern: 'chatMessages'
- name: participant-display-name
  type: regex
  pattern: 'displayName'
- name: calendar-meeting-url
  type: regex
  pattern: 'meeting_url'
- name: no-meeting-link-on-event
  type: regex
  pattern: '(event|ev|evt|e|item)\[[\x22\x27]meeting_link[\x22\x27]\]|(event|ev|evt|e|item)\.get\([\x22\x27]meeting_link'
  match: not_contains
