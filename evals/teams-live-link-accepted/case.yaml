schema_version: "1.1"
name: teams-live-link-accepted
description: "Personal Teams (teams.live.com) links are accepted for guest bots; the work/school rule applies only to signed-in bots."
tags: [round3, teams]
runs: 2
execution:
  prompt: "Can a MeetStream bot join a personal Microsoft Teams meeting, with a teams.live.com link like https://teams.live.com/meet/9384756102938?p=AbCdEfGhIjKlMn? Just answer; do not send a bot."
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
- name: no-bot-sent
  type: tool_used
  tool: mcp__plugin_meetstream_meetstream__create_bot
  min: 0
  max: 0
