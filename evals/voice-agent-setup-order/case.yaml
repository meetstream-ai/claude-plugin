schema_version: "1.1"
name: voice-agent-setup-order
description: "The user asks for a voice agent and does not say which stack: the three flows order (MS-2305 three flows). The bridge server (own stack, bot price only) comes first, then the hosted Agents API (inbuilt keys, then own keys); the own agent only with a warning."
tags: [routing, voice-agent]
runs: 2
execution:
  prompt: "I want an AI voice agent that answers questions in my Zoom meetings. How do I set it up?"
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
- name: bridge-before-hosted
  type: regex
  pattern: '(bridge server|own stack)[\s\S]*(Agents API|MIA|host)'
  flags: i
- name: no-bot-without-link
  type: tool_used
  tool: mcp__plugin_meetstream_meetstream__create_bot
  min: 0
  max: 0
