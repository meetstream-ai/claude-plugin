schema_version: "1.1"
name: voice-agent-local-agent-config
description: "Build tracks (MS-2305, 22 Nov 2026): asked for a local_agent config for their own Claude Code, the reply says track 3d (the user's coding agent through meetstream setup) is coming soon, gives no config or install steps, keeps the prompt-injection warning for the coming track, and offers track 2 or 3a/3c now."
tags: [build-tracks, voice-agent, security]
runs: 1
execution:
  prompt: "Set me up to use my own Claude Code as the brain of a voice agent in my Google Meet calls. Give me the agent config JSON and the steps. Don't ask me questions."
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
- name: coming-soon
  type: regex
  pattern: 'coming soon'
  flags: i
- name: no-local-agent-config
  type: regex
  pattern: '\x22provider\x22\s*:\s*\x22local_agent\x22'
  match: not_contains
- name: no-agent-kit-install
  type: regex
  pattern: '(uv tool|pipx) install meetstream-agent-kit|serve --tunnel|pairing token|Bridge URL'
  flags: i
  match: not_contains
