schema_version: "1.1"
name: notetaker-fastest-path
description: "A notetaker request gets the fastest path (numbered steps, minimal API calls, SDK lines) and the sample-apps link, not a full app scaffold."
tags: [round5, notetaker]
runs: 1
execution:
  prompt: "I want a notetaker: after each Zoom call, the transcript and a summary should land in my app. What's the fastest way to build it on MeetStream?"
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
- name: sample-apps-link
  type: regex
  pattern: 'docs\.meetstream\.ai/tutorials/sample-apps'
- name: create-bot-call
  type: regex
  pattern: 'create_bot|createBot|bots\.create'
