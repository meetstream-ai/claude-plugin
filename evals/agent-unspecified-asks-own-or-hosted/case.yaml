schema_version: "1.1"
name: agent-unspecified-asks-own-or-hosted
description: "The user wants an AI agent in their meetings and says nothing about the stack: one question, own stack (bridge server, any models incl. local) or hosted by MeetStream (Agents API), with the bridge listed first."
tags: [three-flows, voice-agent, routing]
runs: 1
execution:
  prompt: "I want an AI agent in my meetings."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
- name: bridge-before-hosted
  type: regex
  pattern: '(bridge server|own stack|your own (server|models))[\s\S]*(host|Agents API|MIA)'
  flags: i
- name: no-bot-sent
  type: tool_used
  tool: mcp__plugin_meetstream_meetstream__create_bot
  min: 0
  max: 0
