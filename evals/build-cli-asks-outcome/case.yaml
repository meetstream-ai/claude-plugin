schema_version: "1.1"
name: build-cli-asks-outcome
description: "A build request that names only the trigger (a CLI that sends bots) and not the outcome asks once: after the meeting or live."
tags: [round4, routing]
runs: 2
execution:
  prompt: "Build a CLI that sends MeetStream bots to Zoom, Google Meet and Teams links."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
- name: no-voice-agent-mention
  type: regex
  pattern: '\bvoice[- ]agents?\b|\bMIA\b|\btalking bot\b|\bagent_config_id\b|\bbot that (talks|speaks|answers)\b'
  flags: i
  match: not_contains
- name: asks-after-or-live
  type: regex
  pattern: '(after|post)[- ](the )?(meeting|call)[\s\S]{0,400}\blive\b|\blive\b[\s\S]{0,400}(after|post)[- ](the )?(meeting|call)'
  flags: i
