schema_version: "1.1"
name: build-ambiguous-asks-post-call-or-live
description: "An ambiguous build request asks once whether the app works after the meeting or live, before building."
tags: [round3, routing]
runs: 2
execution:
  prompt: "Build me something that records my meetings."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
- name: no-voice-agent-mention
  type: regex
  pattern: '\bvoice[- ]agents?\b|\bMIA\b|\btalking bot\b|\bagent_config_id\b|\bbot that (talks|speaks|answers)\b'
  flags: i
  match: not_contains
- name: asks-after-or-live
  type: regex
  pattern: '(after|post)[- ](the )?(meeting|call)[\s\S]{0,400}\blive\b|\blive\b[\s\S]{0,400}(after|post)[- ](the )?(meeting|call)'
  flags: i
