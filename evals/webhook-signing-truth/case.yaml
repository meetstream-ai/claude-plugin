schema_version: "1.1"
name: webhook-signing-truth
description: "callback_url deliveries are unsigned; workspace webhook endpoints (dashboard) are signed with X-MeetStream-Signature."
tags: [round3, webhooks]
runs: 2
execution:
  prompt: "Build a FastAPI endpoint that receives the MeetStream events sent to the callback_url I pass on create_bot, and verify the webhook signature on every request. Show the code; do not ask me questions."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
- name: signature-header
  type: regex
  pattern: 'X-MeetStream-Signature'
  flags: i
