schema_version: "1.1"
name: voice-agent-user-says-mia
description: "A user who knows the API name MIA still gets the voice-agent flow."
tags: [routing, voice-agent]
runs: 2
execution:
  prompt: "How do I create a MIA agent and attach it to a bot?"
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
- name: agent-config-id
  type: regex
  pattern: 'agent_config_id'
- name: mia-endpoint
  type: regex
  pattern: '/api/v1/mia|POST /mia'
