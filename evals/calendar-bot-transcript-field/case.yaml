schema_version: "1.1"
name: calendar-bot-transcript-field
description: "A calendar-scheduled bot gets a transcript only through recording_config.transcript.provider; a top-level transcription key is ignored."
tags: [round3, calendar]
runs: 2
execution:
  prompt: "Give me the JSON body for POST /api/v1/calendar/schedule/{event_id} so the scheduled bot records audio only and gets a post-call transcript with MeetStream's own transcription. Only the JSON, no questions."
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
- name: recording-config-transcript-provider
  type: regex
  pattern: '\x22recording_config\x22[\s\S]*\x22transcript\x22[\s\S]*\x22provider\x22[\s\S]*\x22meetstream\x22'
- name: no-top-level-transcription
  type: regex
  pattern: '\x22transcription\x22\s*:'
  match: not_contains
